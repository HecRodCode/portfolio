<header class="mobile-bar">
  <button
    #openButton
    type="button"
    class="btn btn-ghost btn-icon"
    aria-controls="mobile-menu"
    [attr.aria-expanded]="layout.menuOpen()"
    [attr.aria-label]="'sidebar.open' | transloco"
    (click)="layout.openMenu()"
  >
    <app-icon name="menu" />
  </button>
</header>

@if (layout.menuOpen()) {
  <div
    id="mobile-menu"
    class="mobile-menu"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="'sidebar.menu' | transloco"
  >
    <div class="mobile-menu-top">
      <button
        #closeButton
        type="button"
        class="btn btn-ghost btn-icon"
        [attr.aria-label]="'sidebar.close' | transloco"
        (click)="close()"
      >
        <app-icon name="close" />
      </button>
    </div>
    <app-site-nav (navigated)="close()" />
    <app-site-controls />
  </div>
}
